name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and Bandit (SA-11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3 compliance-trestle bandit
      - name: Unit tests (pipeline decisions, OSCAL output, chat tools)
        run: |
          python tests/test_pipeline.py
          python tests/test_chat.py
      - name: Bandit
        run: bandit -r src scripts tools -ll

  oscal:
    name: OSCAL validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install compliance-trestle
      - name: SSP is current with the control map
        run: |
          python tools/build_ssp.py
          git diff --exit-code oscal/ssp oscal/ap
      - name: Validate SSP, AP, AR, POA&M against the OSCAL 1.1.3 models
        run: python tools/validate_oscal.py

  terraform:
    name: Terraform fmt and validate (CM-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false -input=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform

  policy:
    name: Policy as code (Checkov + SAS Rego)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkov (skips are inline, each with a reason)
        run: |
          pip install checkov
          checkov -d terraform --framework terraform --quiet --compact
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Rego unit tests
        run: opa test policy/ -v
      - name: SAS Rego rules against the Terraform (control IDs in every message)
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.62.0/conftest_0.62.0_Linux_x86_64.tar.gz | tar xz conftest
          ./conftest test terraform/ --combine --all-namespaces --policy policy/terraform
